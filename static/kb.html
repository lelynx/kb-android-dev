<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --bg2:       #1e293b;
      --bg3:       #273549;
      --card:      #1e293b;
      --border:    #334155;
      --text:      #e2e8f0;
      --text2:     #94a3b8;
      --accent:    #3b82f6;
      --accent2:   #1d4ed8;
      --danger:    #ef4444;
      --success:   #22c55e;
      --tag-bg:    #172554;
      --tag-txt:   #93c5fd;
      --theme-bg:  #1e3a5f;
      --theme-txt: #93c5fd;
      --type-bg:   #2e1065;
      --type-txt:  #c4b5fd;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    #header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    #header h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
    #header h1 small { color: var(--text2); font-weight: 400; font-size: 0.8rem; margin-left: 0.5rem; }

    /* ── Layout ─────────────────────────────────────────────────────── */
    #layout {
      display: flex;
      min-height: calc(100vh - 48px);
    }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    #sidebar {
      width: 210px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 1rem 0.875rem;
    }
    .stat-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.625rem 0.75rem;
      margin-bottom: 0.625rem;
    }
    .stat-card .lbl {
      font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text2);
    }
    .stat-card .val {
      font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1.15;
    }
    .stat-card .sub {
      font-size: 0.68rem; color: var(--text2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Main ────────────────────────────────────────────────────────── */
    #main { flex: 1; padding: 1rem 1.25rem; min-width: 0; }

    /* ── Filters ─────────────────────────────────────────────────────── */
    #filters {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 0.875rem; align-items: center;
    }
    #filters select, #filters input[type="text"] {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.4rem 0.65rem;
      font-size: 0.82rem;
    }
    #filters select { min-width: 145px; }
    #filters input[type="text"] { flex: 1; min-width: 160px; }
    #filters select:focus, #filters input:focus {
      outline: none; border-color: var(--accent);
    }
    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text2);
      padding: 0.4rem 0.65rem;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

    #items-count { font-size: 0.75rem; color: var(--text2); margin-bottom: 0.625rem; }

    /* ── Cards ───────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.875rem 1rem;
      margin-bottom: 0.75rem;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); }

    .card-head {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 0.75rem; margin-bottom: 0.4rem;
    }
    .card-title { font-size: 0.95rem; font-weight: 600; flex: 1; }
    .card-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }

    .btn-sm {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text2);
      padding: 0.25rem 0.55rem;
      font-size: 0.73rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm:hover { background: var(--bg3); color: var(--text); }
    .btn-sm.edit:hover  { border-color: var(--accent); color: var(--accent); }
    .btn-sm.del:hover   { border-color: var(--danger);  color: var(--danger); }

    .card-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
    .badge {
      font-size: 0.68rem; padding: 0.12rem 0.45rem;
      border-radius: 20px; font-weight: 500;
    }
    .badge-theme { background: var(--theme-bg); color: var(--theme-txt); }
    .badge-type  { background: var(--type-bg);  color: var(--type-txt); }

    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.4rem; }
    .tag {
      background: var(--tag-bg); color: var(--tag-txt);
      border-radius: 4px; padding: 0.08rem 0.4rem;
      font-size: 0.67rem; cursor: pointer;
      border: 1px solid transparent; transition: border-color 0.12s;
    }
    .tag:hover { border-color: var(--accent); }

    .section { margin-top: 0.625rem; }
    .section-lbl {
      font-size: 0.63rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text2); margin-bottom: 0.25rem;
    }
    .section-body {
      font-size: 0.82rem; color: var(--text); line-height: 1.65;
    }
    .section-body p           { margin-bottom: 0.35rem; }
    .section-body ul,
    .section-body ol          { padding-left: 1.2rem; }
    .section-body li          { margin-bottom: 0.15rem; }
    .section-body a           { color: var(--accent); }
    .section-body code        { background: #0d1117; padding: 0.1em 0.35em; border-radius: 3px; font-size: 0.85em; }
    .section-body pre         { border-radius: 8px; overflow-x: auto; margin: 0.25rem 0; }
    .section-body pre code.hljs { border-radius: 8px; font-size: 0.8rem; }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    .btn {
      padding: 0.45rem 0.9rem; border-radius: 6px;
      border: none; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-primary:hover   { background: var(--accent2); }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }

    /* ── Modal ───────────────────────────────────────────────────────── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.72); z-index: 200;
      align-items: flex-start; justify-content: center;
      padding: 1.5rem 1rem; overflow-y: auto;
    }
    #overlay.open { display: flex; }

    #modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%; max-width: 680px;
      margin: auto;
    }
    .modal-hd {
      padding: 0.875rem 1.125rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-hd h2 { font-size: 0.95rem; font-weight: 600; }
    .modal-close {
      background: none; border: none;
      color: var(--text2); font-size: 1.3rem;
      cursor: pointer; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 1rem 1.125rem; }
    .modal-ft {
      padding: 0.875rem 1.125rem;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 0.625rem;
    }

    /* ── Form ────────────────────────────────────────────────────────── */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .form-row.full { grid-template-columns: 1fr; }
    .fg { margin-bottom: 0.75rem; }
    .fg label {
      display: block; font-size: 0.75rem; font-weight: 500;
      color: var(--text2); margin-bottom: 0.3rem;
    }
    .fg label .req { color: var(--danger); }
    .fg input, .fg select, .fg textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.45rem 0.7rem;
      font-size: 0.82rem;
      font-family: inherit;
    }
    .fg textarea { resize: vertical; font-family: 'Consolas', 'Cascadia Code', monospace; }
    .fg input:focus, .fg select:focus, .fg textarea:focus {
      outline: none; border-color: var(--accent);
    }

    /* ── Empty state ─────────────────────────────────────────────────── */
    .empty {
      text-align: center; padding: 3rem 1rem; color: var(--text2);
    }

    /* ── Toast ───────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 1.25rem; right: 1.25rem;
      background: var(--success); color: #fff;
      padding: 0.5rem 0.9rem; border-radius: 6px;
      font-size: 0.82rem; opacity: 0;
      transition: opacity 0.3s; z-index: 500;
      pointer-events: none;
    }
    #toast.show   { opacity: 1; }
    #toast.error  { background: var(--danger); }
  </style>
</head>
<body>

<div id="header">
  <h1>📚 Knowledge Base <small id="hdr-count"></small></h1>
  <button class="btn btn-primary" onclick="openModal()">+ Nouvelle fiche</button>
</div>

<div id="layout">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="stat-card">
      <div class="lbl">Total fiches</div>
      <div class="val" id="s-total">0</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Thème sélectionné</div>
      <div class="val" id="s-theme-count">0</div>
      <div class="sub" id="s-theme-name">Tous</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Type sélectionné</div>
      <div class="val" id="s-type-count">0</div>
      <div class="sub" id="s-type-name">Tous</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Tags distincts</div>
      <div class="val" id="s-tags">0</div>
    </div>
  </aside>

  <!-- Main -->
  <main id="main">
    <div id="filters">
      <select id="f-theme" onchange="applyFilters()">
        <option value="">Tous les thèmes</option>
      </select>
      <select id="f-type" onchange="applyFilters()">
        <option value="">Tous les types</option>
      </select>
      <select id="f-tag" onchange="applyFilters()">
        <option value="">Tous les tags</option>
      </select>
      <input type="text" id="f-search" placeholder="🔍 Rechercher dans le titre ou la description…"
             oninput="applyFilters()">
      <button class="btn-reset" onclick="resetFilters()">✕ Réinitialiser</button>
    </div>

    <div id="items-count"></div>
    <div id="items-list"></div>
  </main>
</div>

<!-- Modal create / edit -->
<div id="overlay" onclick="overlayClick(event)">
  <div id="modal">
    <div class="modal-hd">
      <h2 id="modal-title">Nouvelle fiche</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row full">
        <div class="fg">
          <label>Titre <span class="req">*</span></label>
          <input type="text" id="m-titre" placeholder="Titre de la fiche">
        </div>
      </div>
      <div class="form-row">
        <div class="fg">
          <label>Thème <span class="req">*</span></label>
          <select id="m-theme">
            <option value="">— Sélectionner —</option>
          </select>
        </div>
        <div class="fg">
          <label>Type <span class="req">*</span></label>
          <select id="m-type">
            <option value="">— Sélectionner —</option>
          </select>
        </div>
      </div>
      <div class="fg">
        <label>Description</label>
        <textarea id="m-description" rows="3"
                  placeholder="Contexte, problème rencontré…"></textarea>
      </div>
      <div class="fg">
        <label>Code</label>
        <textarea id="m-code" rows="6"
                  placeholder="```kotlin&#10;fun hello() = println(&quot;Hello!&quot;)&#10;```"></textarea>
      </div>
      <div class="fg">
        <label>Solution</label>
        <textarea id="m-solution" rows="3"
                  placeholder="Solution ou explication détaillée…"></textarea>
      </div>
      <div class="fg">
        <label>Tags</label>
        <input type="text" id="m-tags" placeholder="kotlin, compose, state">
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="submitForm()">Enregistrer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- CDN libraries (seules dépendances externes) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script>
  // ── Renderer personnalisé marked.js 4 ──────────────────────────────────
  // La classe .hljs est ajoutée explicitement sur <code> pour que le thème
  // atom-one-dark applique sa couleur de texte par défaut (#abb2bf).
  const mdRenderer = new marked.Renderer();
  mdRenderer.code = function (code, lang) {
    const language = lang && hljs.getLanguage(lang) ? lang : null;
    const highlighted = language
      ? hljs.highlight(code, { language }).value
      : hljs.highlightAuto(code).value;
    return '<pre><code class="hljs">' + highlighted + '</code></pre>';
  };
  marked.setOptions({ renderer: mdRenderer });

  function md(text) {
    return text ? marked.parse(text) : '';
  }

  // ── État ───────────────────────────────────────────────────────────────
  let allItems = [];
  let themes   = [];
  let types    = [];
  let allTags  = [];
  let editingId = null;

  // ── Initialisation ──────────────────────────────────────────────────────
  async function init() {
    await Promise.all([loadThemes(), loadTypes(), loadTags(), loadItems()]);
  }

  async function loadThemes() {
    const r = await fetch('/api/knowledge/themes');
    themes = await r.json();
    populateSelect('f-theme', themes, 'Tous les thèmes');
    populateSelect('m-theme', themes, '— Sélectionner —');
  }

  async function loadTypes() {
    const r = await fetch('/api/knowledge/types');
    types = await r.json();
    populateSelect('f-type', types, 'Tous les types');
    populateSelect('m-type', types, '— Sélectionner —');
  }

  async function loadTags() {
    const r = await fetch('/api/knowledge/tags');
    allTags = await r.json();
    const sel = document.getElementById('f-tag');
    const cur = sel.value;
    sel.innerHTML = '<option value="">Tous les tags</option>';
    allTags.forEach(t => {
      const o = document.createElement('option');
      o.value = o.textContent = t;
      sel.appendChild(o);
    });
    if (cur) sel.value = cur;
    document.getElementById('s-tags').textContent = allTags.length;
  }

  async function loadItems() {
    const r = await fetch('/api/knowledge');
    allItems = await r.json();
    document.getElementById('s-total').textContent = allItems.length;
    document.getElementById('hdr-count').textContent = '(' + allItems.length + ' fiches)';
    applyFilters();
  }

  function populateSelect(id, items, placeholder) {
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = '<option value="">' + esc(placeholder) + '</option>';
    items.forEach(item => {
      const o = document.createElement('option');
      o.value = item.name;
      o.textContent = item.icon + ' ' + item.name;
      sel.appendChild(o);
    });
    if (cur) sel.value = cur;
  }

  // ── Filtres ────────────────────────────────────────────────────────────
  function applyFilters() {
    const themeF  = document.getElementById('f-theme').value;
    const typeF   = document.getElementById('f-type').value;
    const tagF    = document.getElementById('f-tag').value;
    const searchF = document.getElementById('f-search').value.toLowerCase().trim();

    const filtered = allItems.filter(item => {
      if (themeF && item.theme_name !== themeF) return false;
      if (typeF  && item.type_name  !== typeF)  return false;
      if (tagF) {
        const tags = (item.tags || '').split(',').map(t => t.trim());
        if (!tags.includes(tagF)) return false;
      }
      if (searchF) {
        const inTitle = (item.titre       || '').toLowerCase().includes(searchF);
        const inDesc  = (item.description || '').toLowerCase().includes(searchF);
        if (!inTitle && !inDesc) return false;
      }
      return true;
    });

    // Stats sidebar
    const tc = themeF ? allItems.filter(i => i.theme_name === themeF).length : allItems.length;
    const yc = typeF  ? allItems.filter(i => i.type_name  === typeF).length  : allItems.length;
    document.getElementById('s-theme-count').textContent = tc;
    document.getElementById('s-theme-name').textContent  = themeF || 'Tous';
    document.getElementById('s-type-count').textContent  = yc;
    document.getElementById('s-type-name').textContent   = typeF  || 'Tous';

    const n = filtered.length;
    document.getElementById('items-count').textContent =
      n + ' fiche' + (n > 1 ? 's' : '') + ' affichée' + (n > 1 ? 's' : '');

    renderItems(filtered);
  }

  function resetFilters() {
    ['f-theme','f-type','f-tag'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-search').value = '';
    applyFilters();
  }

  // ── Rendu des fiches ───────────────────────────────────────────────────
  function renderItems(items) {
    const el = document.getElementById('items-list');
    if (!items.length) {
      el.innerHTML = '<div class="empty"><p>Aucune fiche trouvée.</p></div>';
      return;
    }
    el.innerHTML = items.map(renderCard).join('');
  }

  function renderCard(item) {
    const tags = item.tags
      ? item.tags.split(',').map(t => t.trim()).filter(Boolean)
      : [];

    const tagsHtml = tags.map(t =>
      '<span class="tag" onclick="filterByTag(\'' + esc(t).replace(/'/g, "\\'") + '\')">'
      + esc(t) + '</span>'
    ).join('');

    const descHtml = item.description ? md(item.description) : '';
    const codeHtml = item.code        ? md(item.code)        : '';
    const solHtml  = item.solution    ? md(item.solution)    : '';

    return '<div class="card" id="card-' + item.id + '">'
      + '<div class="card-head">'
      +   '<div class="card-title">' + esc(item.titre) + '</div>'
      +   '<div class="card-actions">'
      +     '<button class="btn-sm edit" onclick="openModal(' + item.id + ')">✏️ Modifier</button>'
      +     '<button class="btn-sm del"  onclick="deleteItem(' + item.id + ')">🗑️ Supprimer</button>'
      +   '</div>'
      + '</div>'
      + '<div class="card-meta">'
      +   '<span class="badge badge-theme">' + esc(item.theme_icon || '') + ' ' + esc(item.theme_name || '') + '</span>'
      +   '<span class="badge badge-type">'  + esc(item.type_icon  || '') + ' ' + esc(item.type_name  || '') + '</span>'
      + '</div>'
      + (tags.length ? '<div class="tags">' + tagsHtml + '</div>' : '')
      + (descHtml ? '<div class="section"><div class="section-lbl">Description</div><div class="section-body">' + descHtml + '</div></div>' : '')
      + (codeHtml ? '<div class="section"><div class="section-lbl">Code</div><div class="section-body">'        + codeHtml + '</div></div>' : '')
      + (solHtml  ? '<div class="section"><div class="section-lbl">Solution</div><div class="section-body">'    + solHtml  + '</div></div>' : '')
      + '</div>';
  }

  function filterByTag(tag) {
    document.getElementById('f-tag').value = tag;
    applyFilters();
  }

  // ── Modal ──────────────────────────────────────────────────────────────
  function openModal(itemId) {
    editingId = itemId || null;
    clearForm();

    if (editingId) {
      document.getElementById('modal-title').textContent = 'Modifier la fiche';
      const item = allItems.find(i => i.id === editingId);
      if (item) {
        document.getElementById('m-titre').value       = item.titre       || '';
        document.getElementById('m-theme').value       = item.theme_name  || '';
        document.getElementById('m-type').value        = item.type_name   || '';
        document.getElementById('m-description').value = item.description || '';
        document.getElementById('m-code').value        = item.code        || '';
        document.getElementById('m-solution').value    = item.solution    || '';
        document.getElementById('m-tags').value        = item.tags        || '';
      }
    } else {
      document.getElementById('modal-title').textContent = 'Nouvelle fiche';
    }

    document.getElementById('overlay').classList.add('open');
    document.getElementById('m-titre').focus();
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    editingId = null;
  }

  function overlayClick(e) {
    if (e.target === e.currentTarget) closeModal();
  }

  function clearForm() {
    ['m-titre','m-description','m-code','m-solution','m-tags'].forEach(id =>
      document.getElementById(id).value = ''
    );
    document.getElementById('m-theme').value = '';
    document.getElementById('m-type').value  = '';
  }

  // ── Soumission formulaire ──────────────────────────────────────────────
  async function submitForm() {
    const titre      = document.getElementById('m-titre').value.trim();
    const theme_name = document.getElementById('m-theme').value;
    const type_name  = document.getElementById('m-type').value;

    if (!titre)      { toast('Le titre est obligatoire', true);  return; }
    if (!theme_name) { toast('Le thème est obligatoire', true);  return; }
    if (!type_name)  { toast('Le type est obligatoire', true);   return; }

    const payload = {
      titre,
      theme_name,
      type_name,
      description: document.getElementById('m-description').value.trim() || null,
      code:        document.getElementById('m-code').value.trim()        || null,
      solution:    document.getElementById('m-solution').value.trim()    || null,
      tags:        document.getElementById('m-tags').value.trim()        || null,
    };

    try {
      const url    = editingId ? '/api/knowledge/' + editingId : '/api/knowledge';
      const method = editingId ? 'PUT' : 'POST';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        closeModal();
        toast(editingId ? 'Fiche mise à jour !' : 'Fiche créée !');
        await Promise.all([loadThemes(), loadTypes(), loadTags(), loadItems()]);
      } else {
        const err = await res.json().catch(() => ({}));
        toast('Erreur : ' + (err.detail || res.status), true);
      }
    } catch (e) {
      toast('Erreur réseau', true);
    }
  }

  // ── Suppression ────────────────────────────────────────────────────────
  async function deleteItem(id) {
    if (!confirm('Supprimer cette fiche définitivement ?')) return;
    try {
      const res = await fetch('/api/knowledge/' + id, { method: 'DELETE' });
      if (res.status === 204) {
        toast('Fiche supprimée');
        await Promise.all([loadTags(), loadItems()]);
      } else {
        toast('Erreur lors de la suppression', true);
      }
    } catch (e) {
      toast('Erreur réseau', true);
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  let _toastTimer;
  function toast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = (isError ? 'error ' : '') + 'show';
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ''; }, 3000);
  }

  // ── Lancement ──────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
